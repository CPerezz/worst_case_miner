[package]
name = "worst_case_miner"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
hex = "0.4"
fastrand = "2.0"
num_cpus = "1.16"
log = "0.4"
env_logger = "0.11"
askama = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secp256k1 = { version = "0.29", features = ["rand"] }

[build-dependencies]
cc = { version = "1.0", optional = true }

[features]
default = []
cuda = ["cc"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = "none"
strip = "symbols"
panic = "abort"

# `cargo build --profile maxperf` for actual mining / benchmark runs.
# For maximum throughput on the host CPU also pass:
#   RUSTFLAGS="-C target-cpu=native" cargo build --profile maxperf
# Native CPU codegen unlocks AVX2/AVX-512/BMI2 (x86) or NEON (aarch64) for
# autovectorization of the fill / hash / prefix-compare hot path.
[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
